version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: research_factors_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: research_factors
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: research_factors_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: research_factors_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/research_factors?schema=public
      JWT_SECRET: super-secret-production-jwt-key-min-32-chars-long
      APP_URL: http://localhost:3000
      API_URL: http://localhost:5000
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: ./uploads
      LOCAL_STORAGE_PUBLIC_URL: http://localhost:5000/uploads
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: research_factors_web
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
